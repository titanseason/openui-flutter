name: openui_lang_example
description: Demo app for openui_lang.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.5.0
  flutter: '>=3.27.4'
dependencies:
  flutter:
    sdk: flutter
  openui_lang:
    path: ../
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
