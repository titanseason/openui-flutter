name: openui_lang
description: Flutter port of OpenUI Lang 1.0 with a renderer for the 82-component general GenUI library. Markdown rendering uses flutter_markdown_plus; charts are self-drawn.
version: 0.18.0
repository: https://github.com/titanseason/openui-flutter
homepage: https://github.com/titanseason/openui-flutter
environment:
  sdk: ^3.6.2
  flutter: '>=3.27.4'
dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
