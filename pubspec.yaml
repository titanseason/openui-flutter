repository: https://example.invalid/openui-flutter
homepage: https://example.invalid/openui-flutter
environment:
  sdk: ^3.5.0
  flutter: '>=3.27.4'
dependencies:
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
