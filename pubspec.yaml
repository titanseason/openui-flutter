name: openui_flutter
description: Pure Dart port of OpenUI Lang (1.0 subset) + Flutter renderer for the full 86-component GenUI library. Markdown rendering uses flutter_markdown_plus.
version: 1.0.0
# TODO: replace these placeholder URLs with the real repository before
# publishing to pub.dev. They are deliberately under .invalid (a
